spring.application.name=jobportal

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---- First admin account (created on first start if missing) ----
app.admin.email=admin@jobportal.com
app.admin.password=Admin@12345

# ---- Email (Mailtrap fake inbox for testing) ----
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username= username
spring.mail.password= pswd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail-from=noreply@jobportal.local
app.base-url=http://localhost:8080

# ---- File upload (resumes) ----
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=uploads