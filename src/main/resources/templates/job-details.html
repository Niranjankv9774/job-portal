<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Job details')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments :: flash}"></div>

    <a th:href="@{/jobs}" class="small">&larr; Back to jobs</a>
    <h2 class="mt-2" th:text="${job.title}">Title</h2>
    <p class="text-muted" th:text="${job.company.name} + ' - ' + ${job.location}">Company - Location</p>
    <p>
        <span class="badge bg-secondary" th:text="${job.jobType}">Full-time</span>
        <span class="badge bg-light text-dark"
              th:text="${(job.salaryMin != null and job.salaryMax != null) ? (job.salaryMin + ' - ' + job.salaryMax) : 'Salary not disclosed'}">Salary</span>
        <span class="badge bg-danger" th:if="${job.status.name() == 'CLOSED'}">Closed</span>
    </p>

    <h5>About the role</h5>
    <p style="white-space: pre-line;" th:text="${job.description}">Description</p>

    <h5 class="mt-4">About the company</h5>
    <p th:text="${job.company.description != null ? job.company.description : 'No description provided.'}">About</p>

    <hr>

    <!-- Apply area: only for open jobs -->
    <div th:if="${job.status.name() == 'OPEN'}">

        <!-- Already applied -->
        <div th:if="${applied}" class="alert alert-info">You have already applied to this job.</div>

        <!-- Logged-in seeker who has not applied yet -->
        <form sec:authorize="hasRole('SEEKER')" th:unless="${applied}"
              th:action="@{/jobs/{id}/apply(id=${job.id})}" method="post">
            <div class="mb-3">
                <label class="form-label" for="coverNote">Cover note (optional)</label>
                <textarea class="form-control" id="coverNote" name="coverNote" rows="3" maxlength="1000"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Apply now</button>
        </form>

        <!-- Nobody logged in -->
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-primary">Login to apply</a>
    </div>

    <!-- Closed job -->
    <div th:if="${job.status.name() == 'CLOSED'}" class="alert alert-secondary">
        This job is no longer accepting applications.
    </div>
</div>
</body>
</html>
