<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Forgot password')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 460px;">
    <h2 class="mb-3">Forgot password</h2>
    <div th:replace="~{fragments :: flash}"></div>
    <p>Enter your email and we will send you a link to choose a new password.</p>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Send reset link</button>
    </form>
    <p class="mt-3"><a th:href="@{/login}">Back to login</a></p>
</div>
</body>
</html>
