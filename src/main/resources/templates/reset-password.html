<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Reset password')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 460px;">
    <h2 class="mb-3">Choose a new password</h2>

    <!-- Shown when the link is bad, used or expired -->
    <div th:if="${invalid}" class="alert alert-danger">
        This reset link is invalid or has expired.
        <a th:href="@{/forgot-password}">Request a new one</a>.
    </div>

    <!-- Shown only when the link is good -->
    <form th:unless="${invalid}" th:action="@{/reset-password}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{token}">
        <div class="mb-3">
            <label class="form-label" for="password">New password (min 8 characters)</label>
            <input class="form-control" type="password" id="password" th:field="*{password}">
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" type="password" id="confirmPassword" th:field="*{confirmPassword}">
            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Change password</button>
    </form>
</div>
</body>
</html>
