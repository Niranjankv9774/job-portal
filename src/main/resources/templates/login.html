<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 460px;">
    <h2 class="mb-3">Login</h2>
    <div th:replace="~{fragments :: flash}"></div>
    <div th:if="${param.error}" class="alert alert-danger">Wrong email or password, or your account is blocked.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="mt-3 mb-1"><a th:href="@{/forgot-password}">Forgot password?</a></p>
    <p>New here? <a th:href="@{/register}">Create an account</a></p>
</div>
</body>
</html>
