<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Company profile')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-3">Company profile</h2>
    <div th:replace="~{fragments :: flash}"></div>

    <form th:action="@{/recruiter/company}" th:object="${companyForm}" method="post">
        <div class="mb-3">
            <label class="form-label" for="name">Company name</label>
            <input class="form-control" id="name" th:field="*{name}">
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="website">Website</label>
            <input class="form-control" id="website" th:field="*{website}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="location">Location</label>
            <input class="form-control" id="location" th:field="*{location}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">About the company</label>
            <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
</body>
</html>
