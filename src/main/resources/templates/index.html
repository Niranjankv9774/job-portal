<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Find your next job, or your next hire</h1>
        <p class="fs-5 col-md-8">Job seekers can search and apply in minutes. Recruiters can post jobs and manage applicants in one place.</p>
        <a class="btn btn-primary btn-lg" th:href="@{/jobs}">Browse jobs</a>
        <a class="btn btn-outline-secondary btn-lg" th:href="@{/register}" sec:authorize="!isAuthenticated()">Create an account</a>
    </div>
</div>
</body>
</html>
