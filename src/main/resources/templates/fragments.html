<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Reusable <head>: page title + Bootstrap styling -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Job Portal'">Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Reusable navigation bar. Links for other roles appear automatically once those pages exist. -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Job Portal</a>
        <ul class="navbar-nav me-auto flex-row flex-wrap gap-3">
            <li class="nav-item"><a class="nav-link" th:href="@{/jobs}">Browse jobs</a></li>

            <li class="nav-item" sec:authorize="hasRole('SEEKER')"><a class="nav-link" th:href="@{/seeker/applications}">My applications</a></li>
            <li class="nav-item" sec:authorize="hasRole('SEEKER')"><a class="nav-link" th:href="@{/seeker/profile}">My profile</a></li>

            <li class="nav-item" sec:authorize="hasRole('RECRUITER')"><a class="nav-link" th:href="@{/recruiter/company}">Company</a></li>
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')"><a class="nav-link" th:href="@{/recruiter/jobs}">My jobs</a></li>
            <li class="nav-item" sec:authorize="hasRole('RECRUITER')"><a class="nav-link" th:href="@{/recruiter/jobs/new}">Post a job</a></li>

            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/users}">Users</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
            <th:block sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Login</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Register</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <span class="text-light small" sec:authentication="name">user</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>

<!-- Reusable success / error message boxes -->
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

</body>
</html>
